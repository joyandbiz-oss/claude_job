proxy:
  # DataImpulse residential proxy credentials
  # The script reads from env var DI_PROXY_URL, but here's the default for convenience
  env_var: DI_PROXY_URL
  default_url: "http://c607101cbc744679901d_country-us:71addcef09210b43@gw.dataimpulse.com:823"
  # Proxy rotation: change _country-us suffix to target different geos if needed
  # Available: _country-us, _country-gb, _country-de, _country-fr, _country-es
  fallback_direct: true        # Try direct first, proxy on 403/429
  ssl_verify: true             # Only disable as last resort, log warning

rate_limit:
  requests_per_second: 1.5
  retry_max: 3
  retry_base_wait: 2          # seconds, exponential backoff

discovery:
  pages_per_query: 4           # continuation pages per search query
  video_results_per_query: 50  # video search results to scan for authors
  min_subs_discovery: 300      # skip channels with fewer subs in discovery

