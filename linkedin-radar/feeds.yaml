# =============================================================================
# LinkedIn Radar — RSS Feed Configuration
# =============================================================================
# Curated feeds for a Data Infrastructure / Proxy Industry CMO
# 76 sources across 4 tiers
# =============================================================================

scoring:
  dimensions:
    viral_format:
      weight: 0.25
      description: "Can this become an Image-format LinkedIn post with 800+ chars?"
    hook_strength:
      weight: 0.25
      description: "Can it start with a number/stat? Contrarian angle?"
    audience_resonance:
      weight: 0.30
      description: "Relatable to data/tech professionals? Generate debate?"
    timeliness:
      weight: 0.20
      description: "Breaking news? First-mover advantage?"

  thresholds:
    instant_post: 8
    daily_digest_min: 5
    always_include_competitors: true

  competitors:
    - Bright Data
    - Oxylabs
    - Smartproxy
    - Decodo
    - NetNut
    - Zyte
    - Apify
    - IPRoyal
    - Webshare
    - SOAX

# =============================================================================
# TIER 1 — Must Read (check multiple times/day)
# =============================================================================
tier1_must_read:
  description: "Core industry and tech sources — never miss"
  feeds:
    # --- Major Tech News ---
    - name: "TechCrunch"
      url: "https://techcrunch.com/feed/"
      focus: "AI, data infrastructure, funding rounds"

    - name: "The Verge"
      url: "https://www.theverge.com/rss/index.xml"
      focus: "Platform changes, AI, internet policy"

    - name: "Ars Technica"
      url: "https://feeds.arstechnica.com/arstechnica/index"
      focus: "Deep tech analysis, security, AI"

    - name: "Wired"
      url: "https://www.wired.com/feed/rss"
      focus: "Tech culture, privacy, AI trends"

    - name: "MIT Technology Review"
      url: "https://www.technologyreview.com/feed/"
      focus: "AI research, data ethics, emerging tech"

    # --- AI & Data Specific ---
    - name: "VentureBeat AI"
      url: "https://venturebeat.com/category/ai/feed/"
